# ==============================================================================
#  Decap CMS — the content management backend.
#
#  WHAT THIS IS, STATED PLAINLY
#  Decap CMS is a real, maintained, open-source (MIT) Git-based CMS. Its admin UI
#  is served as static files from this project's own /admin/ path, and it writes
#  directly to this repository through the GitHub API. There is no database and no
#  server of ours to run or pay for.
#
#  WHY IT CANNOT AUTHENTICATE ON ITS OWN
#  GitHub Pages is a static file host. It cannot run the OAuth code exchange that
#  turns "user clicked Authorize" into an access token, because that exchange
#  requires a client secret — and a client secret cannot live in a static site.
#  So Decap needs ONE of the two backends below. This is not a limitation of this
#  project; it is how OAuth works against a static host.
#
#  OPTION A — github backend + an OAuth relay  (what most people do)
#    backend.name: github, with base_url pointing at a small free OAuth relay:
#      • Cloudflare Workers + the open-source sveltia-cms-auth worker  (free tier)
#      • a Vercel/Netlify Function running the community OAuth provider (free tier)
#      • Netlify Identity + Git Gateway — Netlify's own hosted auth      (free tier)
#    You must create a GitHub OAuth App and register its callback URL. The exact
#    steps, including which scopes are needed, are in docs/CMS.md.
#
#  OPTION B — local backend  (works right now, zero setup, zero cost)
#    `pnpm run cms` opens a local proxy (decap-server) that writes straight to
#    your working copy. No OAuth, no GitHub App, nothing to pay for. This is what
#    is enabled below, so nothing in this project is broken out of the box and no
#    fake login screen is ever shown.
#
#  IMPORTANT: the public website NEVER depends on this file. src/content/data/
#  holds the content, the site imports it at build time, and the site builds and
#  runs whether or not the CMS is configured or reachable.
#
#  HOW THE FILE SHAPES ARE HANDLED
#  Decap writes a ROOT-LEVEL list widget as { "items": [ ... ] }, so the content
#  files use that shape. src/content/index.ts accepts both the wrapped form and a
#  bare array, so a hand-edit cannot silently empty a page. Files that hold
#  several sibling keys (riding.json) declare one widget per key; Decap merges by
#  key and leaves the keys it does not know about untouched.
# ==============================================================================

# ----------------------------------------------------------------------------
# 环境边界（2026-10-11 实测核定，见 docs/cms-online-readiness.md）

# local_backend: true 表示在 localhost / 127.0.0.1 上一律走 decap-server 代理
# （默认 http://localhost:8081/api/v1，CORS 仅放行本地来源），与 backend 的取值无关。
# 因此将来把 backend 换成线上 github 后端时，本地编辑流程不受任何影响。
# 依据：https://decapcms.org/docs/decap-proxy/
# ----------------------------------------------------------------------------
local_backend: true

backend:
  # 线上后端：GitHub + 自建 OAuth 中转（2026-10-17 部署）
  #
  # 为什么需要中转：GitHub Pages 是纯静态主机，OAuth 的 code→token 交换必须带
  # client secret，而 secret 不能出现在这个公开文件里。中转只做这一次交换，
  # 不接触内容、不存 token。逐步搭建与验证见 docs/CMS-OAUTH-SETUP.md。
  #
  # base_url 是公开值，写在这里没问题；Client ID / Client Secret 只存在于
  # Cloudflare Worker 的加密环境变量中，永远不进仓库。
  name: github
  repo: jiangxiansen1/tangyuan-vision
  # 必须是 master：本仓库的默认分支就是 master（deploy.yml 同时监听 main 和
  # master，但这里写错会表现为“登录成功却一个集合都读不到”，很难排查）。
  branch: master
  base_url: https://sveltia-cms-auth.jiangxiansen1.workers.dev
  auth_endpoint: auth

  # ---- 线上后端启用前的备用配置（本地专用）---------------------------------
  # 若线上中转不可用，把上面几行换成下面两行即可回到本地文件系统代理：
  #   name: proxy
  #   proxy_url: http://localhost:8081/api/v1
  # 注意：'local' 不是任何 decap-cms 版本注册的后端名（实测 3.8.4→latest 均报
  # "Backend not found: local"）；官方名称是 proxy。
  #
  # DO NOT put a personal access token in this file. It is served publicly.

media_folder: public/assets/uploads
public_folder: /assets/uploads

publish_mode: simple
locale: zh_Hans

# A single field definition reused by every list, so the "is this real or an
# example?" question is asked exactly the same way everywhere.
_provenance_options: &provenance
  - { label: '真实内容 / real', value: real }
  - { label: '示例内容 / sample（界面上会显示示例标记）', value: sample }

collections:
  # ========================================================= brand & identity
  - name: brand
    label: 个人品牌
    files:
      - name: identity
        label: 品牌与宣言
        file: src/content/data/brand.json
        fields:
          - { name: nickname, label: 中文昵称, widget: string, hint: '全站展示用。请勿填写真实姓名。' }
          - { name: brandLatin, label: 英文标识, widget: string, hint: '拉丁标识（如 Vision）。禁止拼音主标题。' }
          - { name: brandFull, label: 品牌全称, widget: string, hint: '全站主标题，如「汤圆Vision」。' }
          - { name: brandGloss, label: 中文释义, widget: string, hint: '如「汤圆视界」。' }
          - { name: logoLine, label: 'Logo 品牌文字', widget: string, hint: '应与 Logo 图片上的文字一致' }
          - { name: tagline, label: 中文标语, widget: string }
          - { name: taglineEn, label: 英文标语, widget: string }
          - { name: statement, label: 个人宣言, widget: text }
          - { name: statementEn, label: 宣言英文点缀, widget: string, required: false }
          - name: roles
            label: 关注方向
            widget: list
            field: { name: role, label: 方向, widget: string }
          - name: provenance
            label: 内容来源
            widget: select
            options: *provenance
            default: real

      - name: profile
        label: 四条线索（关于我）
        file: src/content/data/profile.json
        fields:
          - name: items
            label: 说明段落
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: id, label: '标识（英文小写）', widget: string }
              - { name: title, label: 标题, widget: string }
              - { name: titleEn, label: 英文标题, widget: string, required: false }
              - { name: body, label: 正文, widget: text }
              - { name: note, label: '补充说明（可选）', widget: text, required: false }
              - name: provenance
                label: 内容来源
                widget: select
                options: *provenance
                default: sample

  # =================================================================== photos
  - name: photography
    label: 摄影作品
    description: >-
      照片在这里上传：每张作品的「原图」和「缩略图」都是图片字段。
      每张作品必须有一个「唯一标识」id（英文小写加连字符）；旅行记录的 photoIds 引用的就是这个 id，
      所以 id 定好之后不要随意更改。未填写的可选字段不会在页面上显示空标签。
    files:
      - name: photos
        label: 作品列表
        file: src/content/data/photography.json
        fields:
          - name: items
            label: 作品
            label_singular: 一张作品
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: id, label: '唯一标识（英文小写加连字符）', widget: string, hint: '旅行记录的 photoIds 引用这个值。添加作品时先定好它，之后稳定不要改（改了要同步更新引用它的旅行记录）。' }
              - { name: title, label: 标题, widget: string }
              - name: category
                label: 分类
                widget: select
                options:
                  - { label: 风光 landscape, value: landscape }
                  - { label: 人像 portrait, value: portrait }
                  - { label: '未分类 other（历史作品）', value: other }
              - { name: src, label: 原图, widget: image }
              - { name: thumb, label: '缩略图（可选，留空则用原图）', widget: image, required: false }
              - { name: width, label: '宽度（像素）', widget: number, value_type: int, min: 1 }
              - { name: height, label: '高度（像素）', widget: number, value_type: int, min: 1 }
              - { name: description, label: 描述, widget: text }
              - { name: tone, label: 主色调, widget: color, hint: '用于占位背景与灯箱环境色' }
              - { name: takenAt, label: '拍摄时间（可选）', widget: string, required: false, hint: '未提供请留空，不要填写推测值' }
              - { name: location, label: '拍摄地点（可选）', widget: string, required: false }
              - { name: camera, label: '相机（可选）', widget: string, required: false }
              - { name: lens, label: '镜头（可选）', widget: string, required: false }
              - { name: feature, label: 使用大幅头条排版, widget: boolean, default: false }
              - { name: order, label: 排序权重, widget: number, value_type: int, default: 0 }
              - name: provenance
                label: 内容来源
                widget: select
                options:
                  - { label: '真实拍摄 / real', value: real }
                  - { label: '示例图像 / sample', value: sample }
                default: real

  # =================================================================== riding
  #  NOTE: riding.json holds three sibling keys. Decap merges by key, so all
  #  three are declared here and any key not listed is left untouched.
  - name: riding
    label: 摩旅与骑行
    description: '请只填写真实信息。计划中的路线不要标记为已完成。'
    files:
      - name: motorcycle
        label: 摩托车档案
        file: src/content/data/riding.json
        fields:
          - name: motorcycle
            label: 车辆
            widget: object
            fields:
              - { name: id, label: 标识, widget: string }
              - { name: model, label: 车型, widget: string }
              - { name: modelEn, label: '英文车型（可选）', widget: string, required: false }
              - name: confirmedDetails
                label: 已确认参数
                widget: list
                summary: '{{fields.label}}：{{fields.value}}'
                fields:
                  - { name: label, label: 项目, widget: string }
                  - { name: value, label: 数值, widget: string }
              - name: pendingDetails
                label: '待补充项（会显示为待填写提示）'
                widget: list
                field: { name: item, label: 待补充内容, widget: string }
              - { name: note, label: 说明, widget: text, required: false }
              - { name: image, label: '车辆图片（可选）', widget: image, required: false }
              - name: provenance
                label: 内容来源
                widget: select
                options: *provenance
                default: real
          - name: routes
            label: 摩旅路线
            widget: list
            summary: '{{fields.name}}（{{fields.status}}）'
            fields:
              - { name: id, label: 标识, widget: string }
              - { name: name, label: 路线名称, widget: string }
              - { name: nameEn, label: '英文名称（可选）', widget: string, required: false }
              - { name: origin, label: 出发地, widget: string }
              - { name: destination, label: 目的地, widget: string }
              - { name: distanceKm, label: '总里程（公里，可选）', widget: number, required: false, hint: '未实际骑行请留空' }
              - { name: riddenAt, label: '骑行日期（可选，格式 2026-01-01）', widget: string, required: false }
              - name: status
                label: 状态
                widget: select
                options:
                  - { label: '已完成 ridden', value: ridden }
                  - { label: '计划中 planned', value: planned }
                default: planned
              - { name: summary, label: 描述, widget: text }
              - name: stops
                label: 路线点位
                widget: list
                summary: '{{fields.name}}'
                fields:
                  - { name: name, label: 点位名称, widget: string }
                  - { name: lat, label: '纬度（可选）', widget: number, required: false, value_type: float }
                  - { name: lng, label: '经度（可选）', widget: number, required: false, value_type: float }
                  - { name: note, label: 备注, widget: string, required: false }
              - name: highlights
                label: '沿途要点（可选）'
                widget: list
                required: false
                field: { name: item, label: 要点, widget: string }
              - name: provenance
                label: 内容来源
                widget: select
                options: *provenance
                default: sample
          - name: serviceRecords
            label: 维护记录
            widget: list
            required: false
            summary: '{{fields.date}}'
            fields:
              - { name: id, label: 标识, widget: string }
              - { name: date, label: '日期（可选）', widget: string, required: false }
              - { name: odometerKm, label: '里程（公里，可选）', widget: number, required: false }
              - name: items
                label: 项目
                widget: list
                field: { name: item, label: 项目内容, widget: string }
              - { name: note, label: 备注, widget: text, required: false }
              - name: provenance
                label: 内容来源
                widget: select
                options: *provenance
                default: real
          - { name: serviceRecordNote, label: 维护记录空状态说明, widget: text, required: false }

  # ====================================================================== lab
  - name: lab
    label: AI 与编程
    description: '每条记录都必须填写「结论」，包括没有跑通的结论。'
    files:
      - name: notes
        label: 实验记录列表
        file: src/content/data/lab.json
        fields:
          - name: items
            label: 记录
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: id, label: 标识, widget: string }
              - { name: title, label: 标题, widget: string }
              - { name: titleEn, label: '英文标题（可选）', widget: string, required: false }
              - { name: date, label: '日期（可选）', widget: string, required: false }
              - { name: question, label: 问题, widget: text }
              - { name: approach, label: 方法, widget: text }
              - { name: outcome, label: 结论, widget: text, hint: '失败或不确定的结论同样有价值，请如实填写。' }
              - name: tools
                label: 涉及工具
                widget: list
                field: { name: item, label: 工具, widget: string }
              - name: provenance
                label: 内容来源
                widget: select
                options:
                  - { label: '真实记录 / real', value: real }
                  - { label: '示例 / sample', value: sample }
                default: real

  # ================================================================= projects
  - name: projects
    label: 个人项目
    description: '仓库与演示地址没有就留空，页面会显示「待填写」，不会生成假链接。'
    files:
      - name: items
        label: 项目列表
        file: src/content/data/projects.json
        fields:
          - name: items
            label: 项目
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: id, label: 标识, widget: string }
              - { name: name, label: 项目名称, widget: string }
              - { name: nameEn, label: '英文名称（可选）', widget: string, required: false }
              - name: status
                label: 状态
                widget: select
                options:
                  - { label: '已完成 shipped', value: shipped }
                  - { label: '进行中 building', value: building }
                  - { label: '探索中 exploring', value: exploring }
                  - { label: '已暂停 paused', value: paused }
              - { name: summary, label: 简介, widget: text }
              - { name: detail, label: 项目详情, widget: text }
              - name: stack
                label: 使用技术
                widget: list
                field: { name: item, label: 技术, widget: string }
              - { name: cover, label: '封面（可选）', widget: image, required: false }
              - { name: repoUrl, label: '代码仓库地址（可选）', widget: string, required: false, hint: '留空即显示「待填写」。请勿填写不存在的地址。' }
              - { name: demoUrl, label: '演示地址（可选）', widget: string, required: false }
              - name: highlights
                label: '亮点（可选）'
                widget: list
                required: false
                field: { name: item, label: 亮点, widget: string }
              - { name: order, label: 排序权重, widget: number, value_type: int, default: 0 }
              - name: provenance
                label: 内容来源
                widget: select
                options: *provenance
                default: real

  # ================================================================== journal
  - name: journal
    label: 随笔与思考
    files:
      - name: entries
        label: 文章列表
        file: src/content/data/journal.json
        fields:
          - name: items
            label: 文章
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: id, label: 标识, widget: string }
              - { name: title, label: 标题, widget: string }
              - { name: titleEn, label: '英文标题（可选）', widget: string, required: false }
              - name: kind
                label: 类型
                widget: select
                options:
                  - { label: '随笔 essay', value: essay }
                  - { label: '宣言 note', value: note }
                  - { label: '日志 log', value: log }
              - { name: excerpt, label: 摘要, widget: text }
              - name: body
                label: 正文段落
                widget: list
                field: { name: paragraph, label: 段落, widget: text }
              - name: tags
                label: '标签（可选）'
                widget: list
                required: false
                field: { name: tag, label: 标签, widget: string }
              - { name: date, label: '日期（可选）', widget: string, required: false }
              - name: provenance
                label: 内容来源
                widget: select
                options: *provenance
                default: real

  # ==================================================== earth & travels
  # 字段模型与 src/content/data/travels.json 的注释一致；notes 键不在 schema 内，
  # Decap 保存时会原样保留（实测），因此说明文字不会因编辑而丢失。
  - name: travels
    label: 地球与旅行
    description: >-
      「地球 Online 进度」的旅行记录。只填真实经历；没有就留空。
      照片不在这个集合上传：请先在「摄影作品」里上传作品并定好它的「唯一标识」，
      再用本记录的 photoIds 引用那个 id（例如 sample-ridge-01）。
    files:
      - name: records
        label: 旅行记录
        file: src/content/data/travels.json
        fields:
          - name: items
            label: 旅行记录
            widget: list
            summary: '{{fields.regionId}} · {{fields.title}}'
            fields:
              - { name: regionId, label: '地区 ISO 数字代码', widget: string, hint: '字符串，例如中国是 "156"。' }
              - name: status
                label: 状态
                widget: select
                options:
                  - { label: '已到访 visited', value: visited }
                  - { label: '计划中 planned', value: planned }
                  - { label: '尚未记录 unrecorded', value: unrecorded }
                default: unrecorded
              - { name: label, label: '中文名称覆盖（可选）', widget: string, required: false }
              - { name: title, label: '旅行名称（可选）', widget: string, required: false }
              - { name: visitedAt, label: '日期（可选，仅真实到访才填）', widget: string, required: false, hint: 'YYYY-MM-DD' }
              - { name: story, label: '正文（可选）', widget: text, required: false }
              - name: photoIds
                label: '引用作品 id（可选）'
                widget: list
                required: false
                hint: >-
                  照片先在「摄影作品」集合上传（那里的 原图/缩略图 是 image 字段），再回到这里填作品的 id。
                  值必须与「摄影作品」条目的 唯一标识（id）完全相同，例如 sample-ridge-01。
                  当前作品 id：sample-ridge-01 / sample-ridge-02 / sample-asphalt-01 / sample-asphalt-02 /
                  sample-machined-01 / sample-machined-02 / sample-sky-01 / sample-sky-02 /
                  sample-caustic-01 / sample-caustic-02 / sample-caustic-03。
                  留空则面板显示「尚无照片」，不会伪造。
                field: { name: photoId, label: 作品 id, widget: string }
              - { name: latitude, label: '纬度（可选）', widget: number, required: false, valueType: float }
              - { name: longitude, label: '经度（可选）', widget: number, required: false, valueType: float }
              - { name: published, label: 公开显示, widget: boolean, default: false }
  # ================================================================== contact
  - name: contact
    label: 联系方式
    description: '只填写你确实要公开的账号。留空即显示「待填写」。'
    files:
      - name: channels
        label: 渠道列表
        file: src/content/data/contact.json
        fields:
          - name: channels
            label: 渠道
            hint: '只保留三项：抖音（douyin）、邮箱（email）、GitHub（github）。不要新增其它渠道。未提供真实值时保持 confirmed=false。'
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { name: id, label: 标识, widget: string }
              - { name: label, label: 中文名称, widget: string }
              - { name: labelEn, label: 英文名称, widget: string }
              - { name: handle, label: '账号（可选，留空即显示待填写）', widget: string, required: false }
              - { name: url, label: '链接（可选）', widget: string, required: false }
              - { name: confirmed, label: '是否公开', widget: boolean, default: false }
              - { name: note, label: 备注, widget: text, required: false }
          - { name: privacyNote, label: 隐私说明, widget: text }
          - { name: formNote, label: 无留言表单说明, widget: text }

  # ============================================================ site config
  - name: settings
    label: 网站设置
    files:
      - name: site
        label: 基础设置
        file: src/content/data/settings.json
        fields:
          - { name: siteTitle, label: 网站名称, widget: string }
          - { name: siteTitleSuffix, label: 浏览器标题后缀, widget: string }
          - { name: siteDescription, label: 网站描述, widget: text, hint: '用于搜索引擎与分享预览' }
          - { name: themeColor, label: 主题色, widget: color, default: '#05070A' }
          - { name: ogImage, label: 分享预览图, widget: image }
          - { name: homeScene, label: 首页场景标识, widget: string, default: home }
          - { name: secretEnabled, label: 启用隐藏空间入口, widget: boolean, default: true }
          - { name: bootEnabled, label: 启用启动动画, widget: boolean, default: true }
          - { name: locale, label: 语言, widget: string, default: 'zh-CN' }
          - name: keywords
            label: 关键词
            widget: list
            field: { name: keyword, label: 关键词, widget: string }

      - name: secret
        label: 隐藏空间
        file: src/content/data/secret.json
        fields:
          - { name: title, label: 中文标题, widget: string }
          - { name: titleEn, label: 英文标题, widget: string }
          - { name: phrase, label: 输入口令, widget: string, hint: '在站内连续输入这段文字即可进入（默认 explore）' }
          - { name: entryHint, label: '入口提示（可选）', widget: string, required: false }
          - { name: keyboardHint, label: '键盘提示（可选）', widget: string, required: false }
          - name: manifesto
            label: 宣言
            widget: list
            field: { name: line, label: 段落, widget: text }
          - name: artifacts
            label: 留给以后的位置
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { name: id, label: 标识, widget: string }
              - { name: label, label: 名称, widget: string }
              - { name: body, label: 说明, widget: text }
              - name: state
                label: 状态
                widget: select
                options:
                  - { label: '尚未写下 unwritten', value: unwritten }
                  - { label: '已写下 ready', value: ready }
                default: unwritten
